worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include        /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  10.10.10.108;

        # max upload size
        client_max_body_size 75M;

        # Static files (collectstatic)
        location /static {
            alias /home/live/Software/Antigravity_MES/static_collect;
        }

        # Physical path to media files (served directly so images display)
        location /media {
            alias /home/live/Software/Antigravity_MES/media;
        }

        # Protected files: forwarded internally via X-Accel-Redirect only after Django authorises the request
        # (keeps video/large-file streaming off the uWSGI workers; nginx supports Range/sendfile natively)
        location /internal_media/ {
            internal;
            alias /home/live/Software/Antigravity_MES/media/;
        }

        location / {
            uwsgi_pass 127.0.0.1:8081;
            include /home/live/Software/Antigravity_MES/uwsgi_params;
        }
    }
}
