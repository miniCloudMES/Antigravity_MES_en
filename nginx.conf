worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include        /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  10.10.10.108;

        # max upload size
        client_max_body_size 75M;

        # 靜態檔（collectstatic）
        location /static {
            alias /home/live/Software/Antigravity_MES/static_collect;
        }

        # 媒體檔實體路徑（圖片直接顯示用）
        location /media {
            alias /home/live/Software/Antigravity_MES/media;
        }

        # 受保護檔案：僅 Django 驗證後透過 X-Accel-Redirect 內部轉發
        # （避免影片/大檔串流佔住 uWSGI worker；nginx 原生支援 Range/sendfile）
        location /internal_media/ {
            internal;
            alias /home/live/Software/Antigravity_MES/media/;
        }

        location / {
            uwsgi_pass 127.0.0.1:8081;
            include /home/live/Software/Antigravity_MES/uwsgi_params;
        }
    }
}
